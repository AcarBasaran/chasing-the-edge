# Same as rl_threshold_tau1.yaml but trained with the FIXED strict reward (reward/reward_fn_fixed.py,
# eval/parser_fix.py): forward-reverse solutions are no longer zeroed for their choice of variable letters.
# Evaluate with EDGE_FIXED_PARSER=1 (export_base_per_problem.py --fixed-parser) AND with the upstream scorer.
# Arm: THRESHOLD, tau=0.1, delta=0.1 (lo clamp max(tau-delta, tau/2); known-side memory; samplers/core.py).
# Starts at op 11, the fixed band's first level, so the comparison is clean. patience=2 (DECIDED 2026-11-15).
# Base p at op11 ~0.49 (T=0.7): tau=0.1 and 0.3 move UP after 2 steps (patience); tau=0.5 (band 0.4-0.6) HOLDS at 11.
hydra:
  searchpath:
    - file://verl/trainer/config

defaults:
  - rl_base
  - _self_

data:
  sampler:
    method: threshold
    method_kwargs: {tau: 0.1, delta: 0.1, start_level: 11, patience: 2, min_samples: 64}
custom_reward_function:
  path: ${oc.env:EDGE_REPO}/reward/reward_fn_fixed.py
  name: compute_score_with_step_process
