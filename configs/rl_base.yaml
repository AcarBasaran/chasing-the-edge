# Shared settings for every FULL RL run (all six arms). Not a run config itself (no hydra
# searchpath -- Hydra only accepts that in the primary config); each arm's rl_<arm>.yaml
# includes it and sets ONLY data.sampler.method / method_kwargs / probe_every.
#
# Mirrors upstream scripts/composition/op-difficulty-10B/rl-200steps/op11-14_uniform_process_strict.yaml
# (the paper's fixed-band run): train_batch_size 1024, ppo_mini_batch 256, micro 16, n=6, T=1.0,
# lr 1e-6 constant, KL loss 1e-3 low_var_kl, strict process reward. Differences, all deliberate:
#   * pool    : all levels 2-20 (heldout 50k/level, overlong prompts + val/test collisions removed,
#               samplers/build_pool.py) and EVERY arm (incl. fixed band) draws through our sampler,
#               so the arms differ ONLY in data.sampler.method. Fixed band = uniform over 11-14 = the
#               paper's RandomSampler over op11-14 (equal-size buckets).
#   * steps   : set per run by the launcher (trainer.total_training_steps); paper = 195 (1 epoch of 200k).
#   * val     : 32 problems/level x op2-20 tracking set, n=8 at T=1.0, every test_freq steps
#               (measurement only; identical for every arm; samplers never see it).
#   * GPUs    : 4 (paper: 6). Global batch sizes unchanged, so the optimisation is identical.
# Launch: sbatch slurm/rl_run.sbatch <arm> <seed> [hydra overrides]   (arm = rl_<arm>.yaml)
defaults:
  - ppo_trainer
  - _self_

algorithm:
  adv_estimator: grpo
  use_kl_in_reward: false

data:
  train_files:
    - ${oc.env:EDGE_SCRATCH}/data/pool_50k/op2-50k.jsonl
    - ${oc.env:EDGE_SCRATCH}/data/pool_50k/op3-50k.jsonl
    - ${oc.env:EDGE_SCRATCH}/data/pool_50k/op4-50k.jsonl
    - ${oc.env:EDGE_SCRATCH}/data/pool_50k/op5-50k.jsonl
    - ${oc.env:EDGE_SCRATCH}/data/pool_50k/op6-50k.jsonl
    - ${oc.env:EDGE_SCRATCH}/data/pool_50k/op7-50k.jsonl
    - ${oc.env:EDGE_SCRATCH}/data/pool_50k/op8-50k.jsonl
    - ${oc.env:EDGE_SCRATCH}/data/pool_50k/op9-50k.jsonl
    - ${oc.env:EDGE_SCRATCH}/data/pool_50k/op10-50k.jsonl
    - ${oc.env:EDGE_SCRATCH}/data/pool_50k/op11-50k.jsonl
    - ${oc.env:EDGE_SCRATCH}/data/pool_50k/op12-50k.jsonl
    - ${oc.env:EDGE_SCRATCH}/data/pool_50k/op13-50k.jsonl
    - ${oc.env:EDGE_SCRATCH}/data/pool_50k/op14-50k.jsonl
    - ${oc.env:EDGE_SCRATCH}/data/pool_50k/op15-50k.jsonl
    - ${oc.env:EDGE_SCRATCH}/data/pool_50k/op16-50k.jsonl
    - ${oc.env:EDGE_SCRATCH}/data/pool_50k/op17-50k.jsonl
    - ${oc.env:EDGE_SCRATCH}/data/pool_50k/op18-50k.jsonl
    - ${oc.env:EDGE_SCRATCH}/data/pool_50k/op19-50k.jsonl
    - ${oc.env:EDGE_SCRATCH}/data/pool_50k/op20-50k.jsonl
  val_files:
    - ${oc.env:EDGE_REPO}/data/track32/op2-32.jsonl
    - ${oc.env:EDGE_REPO}/data/track32/op3-32.jsonl
    - ${oc.env:EDGE_REPO}/data/track32/op4-32.jsonl
    - ${oc.env:EDGE_REPO}/data/track32/op5-32.jsonl
    - ${oc.env:EDGE_REPO}/data/track32/op6-32.jsonl
    - ${oc.env:EDGE_REPO}/data/track32/op7-32.jsonl
    - ${oc.env:EDGE_REPO}/data/track32/op8-32.jsonl
    - ${oc.env:EDGE_REPO}/data/track32/op9-32.jsonl
    - ${oc.env:EDGE_REPO}/data/track32/op10-32.jsonl
    - ${oc.env:EDGE_REPO}/data/track32/op11-32.jsonl
    - ${oc.env:EDGE_REPO}/data/track32/op12-32.jsonl
    - ${oc.env:EDGE_REPO}/data/track32/op13-32.jsonl
    - ${oc.env:EDGE_REPO}/data/track32/op14-32.jsonl
    - ${oc.env:EDGE_REPO}/data/track32/op15-32.jsonl
    - ${oc.env:EDGE_REPO}/data/track32/op16-32.jsonl
    - ${oc.env:EDGE_REPO}/data/track32/op17-32.jsonl
    - ${oc.env:EDGE_REPO}/data/track32/op18-32.jsonl
    - ${oc.env:EDGE_REPO}/data/track32/op19-32.jsonl
    - ${oc.env:EDGE_REPO}/data/track32/op20-32.jsonl
  tokenizer: null
  train_batch_size: 1024
  val_batch_size: null
  max_prompt_length: 1024
  max_response_length: 1024
  id_max_op: 10
  filter_overlong_prompts: false     # pool is pre-filtered with the exact replica (build_pool.py)
  truncation: error                  # so an overlong prompt would fail loudly, never silently
  shuffle: false                     # ignored when a sampler is set; explicit for clarity
  seed: 0                            # overridden by the launcher (= run seed)
  dataloader_num_workers: 0          # required by the curriculum hook (no prefetch)
  custom_cls:
    path: verl/dataset.py
    name: CustomRLHFDataset
  sampler:
    class_path: ${oc.env:EDGE_REPO}/samplers/verl_adapter.py
    class_name: EdgeCurriculumSampler
    method: ???                      # set by the arm config
    method_kwargs: {}
    total_steps: ${trainer.total_training_steps}
    probe_every: 0
    probe_prompts_per_level: 4       # x rollout.n = 24 rollouts per level per probe (CLAUDE.md: >= 8, ideally 16)
    seed: ${data.seed}
    log_path: ${trainer.default_local_dir}/../sampler_log.jsonl

custom_reward_function:
  path: verl/reward_fn.py
  name: compute_score_with_step_process
  reward_kwargs:
    answer_weight: 1.0
    step_weight: 0.0
    value_tolerance: 1e-6
    zero_on_process_mismatch: true

actor_rollout_ref:
  model:
    path: ${oc.env:EDGE_BASE_MODEL}
    enable_gradient_checkpointing: true
    use_remove_padding: true
  actor:
    optim:
      lr: 1e-6
    ppo_mini_batch_size: 256
    ppo_micro_batch_size_per_gpu: 16
    use_kl_loss: true
    kl_loss_coef: 0.001
    kl_loss_type: low_var_kl
    entropy_coeff: 0.0
    fsdp_config:
      param_offload: false
      optimizer_offload: false
  rollout:
    name: vllm
    gpu_memory_utilization: 0.5
    n: 6
    temperature: 1.0
    tensor_model_parallel_size: 1
    log_prob_micro_batch_size_per_gpu: 16
    val_kwargs:
      do_sample: true
      temperature: 1.0
      top_p: 1.0
      top_k: -1
      n: 8
  ref:
    log_prob_micro_batch_size_per_gpu: 16
    fsdp_config:
      param_offload: false

ray_init:
  num_cpus: 32

trainer:
  critic_warmup: 0
  logger: [console]
  project_name: chasing-the-edge
  experiment_name: ???               # set by the launcher: <arm>_s<seed>[_tag]
  default_local_dir: ${oc.env:EDGE_SCRATCH}/outputs/runs/${trainer.experiment_name}/ckpt
  n_gpus_per_node: 4
  nnodes: 1
  save_freq: 25
  max_actor_ckpt_to_keep: null
  test_freq: 10
  val_before_train: true
  log_val_generations: 0
  total_epochs: 1                    # the sampler's __len__ = total_training_steps * batch -> 1 epoch
  total_training_steps: 100
